name: Label automated PRs

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    name: Add "3. automated" label
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == '74k2'
    steps:
      - name: Apply label
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_BOT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f 'labels[]=3. automated'
