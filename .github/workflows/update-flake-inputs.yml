name: Update flake inputs

on:
  schedule:
    # Mondays 04:00 UTC; the odd-week guard makes this effectively bi-weekly.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update flake.lock and open PR
    runs-on: ubuntu-latest
    steps:
      - name: Skip on odd ISO weeks
        id: week-guard
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          week="$(date +%V)"
          echo "ISO week: $week"
          if (( 10#$week % 2 == 1 )); then
            echo "Odd week, skipping (bi-weekly schedule)."
            echo skip=true >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.week-guard.outputs.skip != 'true'

      - uses: cachix/install-nix-action@v31
        if: steps.week-guard.outputs.skip != 'true'
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-substituters = https://tixpkgs.cachix.org
            extra-trusted-public-keys = tixpkgs.cachix.org-1:Q52x6PMD7ZuTC7oRihwp5lP9YaEaYtrfxYkwzEpjSRI=

      - name: Update flake inputs
        id: update
        if: steps.week-guard.outputs.skip != 'true'
        # Log and PR body go to /tmp so the bot's branch commit stays
        # clean (create-pull-request commits every changed file in the
        # working tree).
        run: |
          set -euo pipefail
          nix flake update 2>&1 | tee /tmp/update.log
          {
            echo 'Automated nix flake update. CI builds all packages and module checks on this PR (see check-pr).'
            echo
            echo '### Updated inputs'
            echo
            echo '```'
            cat /tmp/update.log
            echo '```'
          } > /tmp/pr-body.md

      - name: Create or update PR
        id: cpr
        if: steps.week-guard.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # 74k2's token is rejected with "Permission to 74k1/tixpkgs.git denied to 74k2".
          token: ${{ secrets.GH_PAT }}
          author: 74k1 <git.t@betsumei.com>
          committer: 74k1 <git.t@betsumei.com>
          branch: flake/auto-update
          delete-branch: true
          title: Update flake inputs
          commit-message: 'flake.lock: update inputs'
          body-path: /tmp/pr-body.md
          labels: |
            3. automated

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if gh pr merge "$PR_NUMBER" --auto --merge --delete-branch --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
              echo "Auto-merge enabled on PR #${PR_NUMBER}"
              exit 0
            fi
            echo "PR still stabilizing, retrying... ($i/30)"
            sleep 10
          done
          echo "::error::Timed out waiting for PR checks to stabilize"
          exit 1
