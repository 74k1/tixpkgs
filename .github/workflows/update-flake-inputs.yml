name: Update flake inputs

on:
  schedule:
    # Mondays 04:00 UTC; the odd-week guard makes this effectively bi-weekly.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update flake.lock and open PR
    runs-on: ubuntu-latest
    steps:
      - name: Skip on odd ISO weeks
        id: week-guard
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          week="$(date +%V)"
          echo "ISO week: $week"
          if (( 10#$week % 2 == 1 )); then
            echo "Odd week, skipping (bi-weekly schedule)."
            echo skip=true >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.week-guard.outputs.skip != 'true'

      - uses: cachix/install-nix-action@v31
        if: steps.week-guard.outputs.skip != 'true'
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-substituters = https://tixpkgs.cachix.org
            extra-trusted-public-keys = tixpkgs.cachix.org-1:Q52x6PMD7ZuTC7oRihwp5lP9YaEaYtrfxYkwzEpjSRI=

      - name: Update flake inputs
        id: update
        if: steps.week-guard.outputs.skip != 'true'
        # Log and PR body go to /tmp so the bot's branch commit stays
        # clean (create-pull-request commits every changed file in the
        # working tree).
        run: |
          set -euo pipefail
          nix flake update 2>&1 | tee /tmp/update.log
          {
            echo 'Automated nix flake update. CI builds all packages and module checks on this PR (see check-pr).'
            echo
            echo '### Updated inputs'
            echo
            echo '```'
            cat /tmp/update.log
            echo '```'
          } > /tmp/pr-body.md

      - name: Create or update PR
        if: steps.week-guard.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Bot-account token (74k2). The PR author must be 74k2 so
          # label-automated-prs and enable-auto-merge recognize it as an
          # automation PR. The commit identity below is still the repo owner.
          token: ${{ secrets.GH_PAT_BOT }}
          author: 74k1 <git.t@betsumei.com>
          committer: 74k1 <git.t@betsumei.com>
          branch: flake/auto-update
          delete-branch: true
          title: Update flake inputs
          commit-message: 'flake.lock: update inputs'
          body-path: /tmp/pr-body.md
          labels: |
            3. automated
