name: Check PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  changed-things:
    name: Build changed packages and module checks
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # Keep existing swap; large Nix builds benefit more from swap than
          # the small amount of disk space reclaimed by removing it.
          swap-storage: false
          # The upstream action fails its combined removal when a package is absent.
          large-packages: false

      - name: Remove large packages
        run: |
          set -euo pipefail
          mapfile -t packages < <(
            dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\n' |
              awk '$1 == "ii" { print $2 }' |
              grep -E '^(aspnetcore-|dotnet-|llvm-|php|mongodb-|mysql-|azure-cli$|google-chrome-stable$|firefox$|powershell$|mono-devel$|libgl1-mesa-dri$|google-cloud-sdk$|google-cloud-cli$)' || true
          )
          if [ "${#packages[@]}" -gt 0 ]; then
            sudo apt-get remove -y -- "${packages[@]}"
          fi
          sudo apt-get autoremove -y
          sudo apt-get clean

      - name: Add build swap
        run: |
          set -euo pipefail
          sudo fallocate -l 16G /mnt/nix-build-swapfile
          sudo chmod 600 /mnt/nix-build-swapfile
          sudo mkswap /mnt/nix-build-swapfile
          sudo swapon /mnt/nix-build-swapfile
          free -h

      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/${{ github.repository }}.git "$BASE_SHA"

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-substituters = https://tixpkgs.cachix.org
            extra-trusted-public-keys = tixpkgs.cachix.org-1:Q52x6PMD7ZuTC7oRihwp5lP9YaEaYtrfxYkwzEpjSRI=

      - name: Test PR target selection
        run: bash .github/tests/select-pr-checks.sh

      - name: Detect changed packages and module checks
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CACHIX_SKIP: ${{ vars.CACHIX_SKIP || '' }}
        run: bash .github/scripts/select-pr-checks.sh

      - uses: cachix/cachix-action@v17
        with:
          name: tixpkgs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      - name: Build changed packages
        env:
          PACKAGES: ${{ steps.detect.outputs.packages }}
        run: |
          set -euo pipefail

          mapfile -t packages < <(jq -r '.[]' <<< "$PACKAGES")
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No changed packages to build."
            exit 0
          fi

          log_directory="$(mktemp -d)"
          trap 'rm -rf "$log_directory"' EXIT
          failed=()
          for pkg in "${packages[@]}"; do
            echo "::group::package ${pkg}"
            if nix build --print-build-logs ".#${pkg}" 2>&1 | tee "${log_directory}/${pkg}.log"; then
              echo "Built package ${pkg}"
            else
              failed+=("${pkg}")
            fi
            echo "::endgroup::"
          done

          if [ "${#failed[@]}" -ne 0 ]; then
            {
              echo '## Failed packages'
              echo
              if [ "${#failed[@]}" -le 5 ]; then
                for pkg in "${failed[@]}"; do
                  printf '### `%s`\n\n' "$pkg"
                  echo '````text'
                  tail -n 30 "${log_directory}/${pkg}.log"
                  echo '````'
                  echo
                done
              else
                for pkg in "${failed[@]}"; do
                  printf -- '- `%s`\n' "$pkg"
                done
                echo
                echo 'More than five packages failed. See the build logs for details.'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'Failed packages: %s\n' "${failed[*]}" >&2
            exit 1
          fi

      - name: Build module checks
        if: ${{ !cancelled() && steps.detect.outcome == 'success' }}
        env:
          MODULE_CHECKS: ${{ steps.detect.outputs.module-checks }}
        run: |
          set -euo pipefail

          mapfile -t checks < <(jq -r '.[]' <<< "$MODULE_CHECKS")
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "No module checks to build."
            exit 0
          fi

          failed=()
          for check in "${checks[@]}"; do
            echo "::group::module check ${check}"
            if nix build --print-build-logs ".#checks.x86_64-linux.${check}"; then
              echo "Built module check ${check}"
            else
              failed+=("${check}")
            fi
            echo "::endgroup::"
          done

          if [ "${#failed[@]}" -ne 0 ]; then
            printf 'Failed module checks: %s\n' "${failed[*]}" >&2
            exit 1
          fi
